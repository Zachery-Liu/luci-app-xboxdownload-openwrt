name: Build OpenWrt APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'package/**'
      - 'install.sh'
      - 'tests/**'
      - 'docs/assets/logo.svg'
      - '.github/workflows/**'
      - '.shellcheckrc'
      - '.github/dependabot.yml'
  pull_request:
    paths:
      - 'package/**'
      - 'install.sh'
      - 'tests/**'
      - 'docs/assets/logo.svg'
      - '.github/workflows/**'
      - '.shellcheckrc'
      - '.github/dependabot.yml'
  schedule:
    - cron: '17 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  IMAGEBUILDER_URL: https://downloads.openwrt.org/releases/25.12.6/targets/x86/64
  IMAGEBUILDER_ARCHIVE: openwrt-imagebuilder-25.12.6-x86-64.Linux-x86_64.tar.zst
  IMAGEBUILDER_SHA256: a792e29bd2233cda67a0823030bfb53c0b61fbb3836b2063e88adf89730d563b

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          printf '%s  %s\n' 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 "$archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP" shellcheck-v0.11.0/shellcheck
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" --version
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Check OpenWrt shell scripts
        run: python3 tests/check-shell.py
      - name: Install and run actionlint
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck="" -pyflakes=""
      - name: Validate upstream sample discovery
        run: python3 tests/check-upstreams.py validate

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ROOTFS_ARCHIVE: openwrt-25.12.6-x86-64-generic-targz-rootfs.tar.gz
      ROOTFS_SHA256: d09cb68dd78a7f7b1c4ed788ad42162e07ec094b20f66b382cd4f91c9443970f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dnsutils iproute2 iputils-ping nftables openssl zstd

      - name: Build and verify the APK
        shell: bash
        run: |
          archive="$RUNNER_TEMP/$IMAGEBUILDER_ARCHIVE"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" "$IMAGEBUILDER_URL/$IMAGEBUILDER_ARCHIVE"
          printf '%s  %s\n' "$IMAGEBUILDER_SHA256" "$archive" | sha256sum --check
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"

          apk_tool="$RUNNER_TEMP/${IMAGEBUILDER_ARCHIVE%.tar.zst}/staging_dir/host/bin/apk"
          mkdir -p dist
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            sudo sh package/build.sh "$apk_tool" "${GITHUB_REF_NAME#v}"
          else
            sudo sh package/build.sh "$apk_tool"
          fi

          cd dist
          shopt -s nullglob
          packages=(luci-app-xboxdownload-openwrt-*.apk)
          test "${#packages[@]}" -eq 1
          "$apk_tool" adbdump --allow-untrusted "${packages[0]}" | grep -Fx '  arch: noarch'
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${packages[0]#luci-app-xboxdownload-openwrt-}"
            version="${version%.apk}"
            if [[ "$GITHUB_REF_NAME" == *-r* ]]; then
              test "$GITHUB_REF_NAME" = "v$version"
            else
              test "$GITHUB_REF_NAME" = "v${version%-r*}"
            fi
          fi
          sha256sum "${packages[0]}" > SHA256SUMS

      - name: Run OpenWrt regression and package installation tests
        shell: bash
        run: |
          rootfs="$RUNNER_TEMP/$ROOTFS_ARCHIVE"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$rootfs" "$IMAGEBUILDER_URL/$ROOTFS_ARCHIVE"
          printf '%s  %s\n' "$ROOTFS_SHA256" "$rootfs" | sha256sum --check
          apk_tool="$RUNNER_TEMP/${IMAGEBUILDER_ARCHIVE%.tar.zst}/staging_dir/host/bin/apk"
          sudo env OPENWRT_ROOTFS="$rootfs" APK_TOOL="$apk_tool" sh tests/install-package.sh dist/*.apk
          sudo env OPENWRT_ROOTFS="$rootfs" APK_TOOL="$apk_tool" sh tests/update-package.sh dist/*.apk
          sudo env OPENWRT_ROOTFS="$rootfs" sh tests/reliability.sh
          sudo env OPENWRT_ROOTFS="$rootfs" sh tests/ipv6-devices.sh

      - name: Test LuCI in Chrome
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-tests"
          source "$RUNNER_TEMP/browser-tests/bin/activate"
          pip install -r tests/requirements.txt
          mkdir -p "$RUNNER_TEMP/luci"
          tar -xzf "$RUNNER_TEMP/$ROOTFS_ARCHIVE" -C "$RUNNER_TEMP/luci" ./www
          OPENWRT_WWW="$RUNNER_TEMP/luci/www" PLAYWRIGHT_CHANNEL=chrome python tests/luci-browser.py

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwrt-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error

  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test OpenWrt ARM64 DNS and firewall behavior
        shell: bash
        run: |
          rootfs="$RUNNER_TEMP/openwrt-arm64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$rootfs" \
            https://downloads.openwrt.org/releases/25.12.6/targets/armsr/armv8/openwrt-25.12.6-armsr-armv8-generic-targz-rootfs.tar.gz
          printf '%s  %s\n' b781548d30886845176fee8256e115188029de0c42af252ffc6ea94a62794381 "$rootfs" | sha256sum --check
          if ! command -v dig || ! command -v ip || ! command -v ping || ! command -v openssl; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y dnsutils iproute2 iputils-ping openssl
          fi
          sudo env OPENWRT_ROOTFS="$rootfs" sh tests/reliability.sh
          sudo env OPENWRT_ROOTFS="$rootfs" sh tests/ipv6-devices.sh

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, arm64, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openwrt-apk
          path: dist

      - name: Install OpenWrt signing tool
        shell: bash
        run: |
          if ! command -v zstd >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y zstd
          fi
          archive="$RUNNER_TEMP/$IMAGEBUILDER_ARCHIVE"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" "$IMAGEBUILDER_URL/$IMAGEBUILDER_ARCHIVE"
          printf '%s  %s\n' "$IMAGEBUILDER_SHA256" "$archive" | sha256sum --check
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"

      - name: Sign and verify release APK
        id: sign
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        shell: bash
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          shopt -s nullglob
          packages=(luci-app-xboxdownload-openwrt-*.apk)
          test "${#packages[@]}" -eq 1
          package=${packages[0]}
          apk_tool="$RUNNER_TEMP/${IMAGEBUILDER_ARCHIVE%.tar.zst}/staging_dir/host/bin/apk"
          sh ../package/sign-release.sh "$apk_tool" "$package"
          unset APK_SIGNING_KEY
          sha256sum "$package" > "$package.sha256"
          cp ../package/xboxdownload-openwrt-release.pem .
          printf 'package=%s\n' "$package" >> "$GITHUB_OUTPUT"

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PACKAGE: ${{ steps.sign.outputs.package }}
        shell: bash
        run: |
          cd dist
          package=$RELEASE_PACKAGE
          checksum="$package.sha256"
          public_key=xboxdownload-openwrt-release.pem
          sha256sum --check "$checksum"
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')
          test "$tag_commit" = "$GITHUB_SHA"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            remote=$(mktemp -d)
            trap 'rm -rf "$remote"' EXIT
            for asset in "$package" "$checksum" "$public_key"; do
              if ! gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --output "$remote/$asset" ||
                 ! cmp -s -- "$asset" "$remote/$asset"; then
                echo "::error::Published release $RELEASE_TAG differs from this build. Publish under a new version or revision tag."
                exit 1
              fi
            done
          else
            gh release create "$RELEASE_TAG" "$package" "$checksum" "$public_key" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
