name: Upstream availability

on:
  schedule:
    - cron: '37 1 * * 3'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/check-upstreams.py'
      - '.github/workflows/upstream-check.yml'
      - '.github/workflows/build-apk.yml'
      - 'package/root/usr/libexec/rpcd/xboxdownload_openwrt'

permissions:
  contents: read

concurrency:
  group: upstream-availability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openwrt:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check stable OpenWrt releases
        run: python3 tests/check-upstreams.py openwrt

  cdn:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check CDN sample resources
        run: python3 tests/check-upstreams.py cdn
